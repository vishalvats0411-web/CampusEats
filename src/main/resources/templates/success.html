<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CampusEats - Order Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center mt-5 bg-light">
<div class="container">
    <h1 class="text-success mt-5">Order Placed Successfully! 🎉</h1>

    <div class="card mx-auto mt-4 p-4 shadow-sm" style="max-width: 300px; border: 2px dashed #28a745;">
        <h3 class="text-muted mb-3">Your Pickup OTP</h3>
        <h1 class="display-4 fw-bold text-dark" th:text="${otp}">123456</h1>
        <small class="text-muted mt-2">Show this to the canteen admin to pick up your order.</small>
    </div>

    <p class="mt-4 lead">Head over to the canteen to pick up your food.</p>
    <a href="/canteens" class="btn btn-primary btn-lg rounded-pill mt-2 px-5">Order More</a>
</div>
</body>
</html>
