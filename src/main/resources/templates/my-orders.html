<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CampusEats - My Orders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-body"> <nav class="app-navbar">
    <a href="/canteens" class="logo">
        <img th:src="@{/images/new-logo.png}" alt="CampusEats Logo">
        CampusEats
    </a>

    <div class="nav-actions">
        <a href="/cart/checkout" class="btn-nav-outline">
            <i class="fa-solid fa-cart-shopping"></i> Cart
            <span class="cart-badge" th:text="${session.cart != null ? session.cart.size() : 0}">0</span>
        </a>
        <a href="/profile" class="btn-nav-outline">
            <i class="fa-solid fa-user"></i> Profile
        </a>
        <a href="/cart/my-orders" class="btn-nav-outline">
            <i class="fa-solid fa-bag-shopping"></i> My Orders
        </a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-nav-outline" style="cursor: pointer;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </form>
    </div>
</nav>

<div class="container mt-5 p-4 bg-white rounded shadow-sm">
    <h2 class="fw-bold mb-4">My Orders</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="'#' + ${order.id}"></td>
            <td>
                <ul class="list-unstyled mb-0">
                    <li th:each="item : ${order.orderItems}" th:text="${item.itemName} + ' x' + ${item.quantity}"></li>
                </ul>
            </td>
            <td th:text="'₹' + ${order.totalAmount}"></td>
            <td>
                <span class="badge bg-warning" th:text="${order.status}"></span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
