<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center mt-5">
<h1 class="text-danger">Oops! 😕</h1>

<p class="lead" th:if="${errorMessage}" th:text="${errorMessage}"></p>
<p class="lead" th:if="${message}" th:text="${message}"></p>

<a href="/canteens" class="btn btn-primary mt-3">Go Home</a>
</body>
</html>
