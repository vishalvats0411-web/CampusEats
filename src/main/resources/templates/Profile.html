<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CampusEats - Profile</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="app-body">

<nav class="app-navbar">
    <a href="/canteens" class="logo">
        <img th:src="@{/images/new-logo.png}" alt="CampusEats Logo">
        CampusEats
    </a>

    <div class="nav-actions">
        <a href="/cart/checkout" class="btn-nav-outline">
            <i class="fa-solid fa-cart-shopping"></i> Cart
            <span class="cart-badge" th:text="${session.cart != null ? session.cart.size() : 0}">0</span>
        </a>
        <a href="/profile" class="btn-nav-outline">
            <i class="fa-solid fa-user"></i> Profile
        </a>
        <a href="/cart/my-orders" class="btn-nav-outline">
            <i class="fa-solid fa-bag-shopping"></i> My Orders
        </a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-nav-outline" style="cursor: pointer;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </form>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <h2 class="mb-4">My Profile</h2>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/profile/update}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Name</label>
                    <input type="text" name="name" th:value="${user.name}" class="form-control">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Dietary Preference</label>
                    <select name="dietaryPreference" class="form-select">
                        <option value="None" th:selected="${user.dietaryPreference == 'None'}">None</option>
                        <option value="Veg" th:selected="${user.dietaryPreference == 'Veg'}">Vegetarian</option>
                        <option value="Vegan" th:selected="${user.dietaryPreference == 'Vegan'}">Vegan</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
