<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEats - Checkout</title>

    <!-- Custom Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap (Keep this for your order summary table/layout) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body">
<nav class="app-navbar">
    <a href="/canteens" class="logo">
        <img th:src="@{/images/new-logo.png}" alt="CampusEats Logo">
        CampusEats
    </a>

    <div class="nav-actions">
        <a href="/cart/checkout" class="btn-nav-outline">
            <i class="fa-solid fa-cart-shopping"></i> Cart
            <span class="cart-badge" th:text="${session.cart != null ? session.cart.size() : 0}">0</span>
        </a>
        <a href="/profile" class="btn-nav-outline">
            <i class="fa-solid fa-user"></i> Profile
        </a>
        <a href="/cart/my-orders" class="btn-nav-outline">
            <i class="fa-solid fa-bag-shopping"></i> My Orders
        </a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn-nav-outline" style="cursor: pointer;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </button>
        </form>
    </div>
</nav>

<div class="container mt-5 mb-5" style="max-width: 900px;">

    <!-- 1. The Header (You already have this) -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark m-0">Your Order Summary</h2>
        <a href="/canteens" class="btn btn-outline-secondary rounded-pill">Continue Shopping</a>
    </div>

    <!-- 2. What to show if the cart is EMPTY -->
    <div th:if="${session.cart == null or session.cart.isEmpty()}" class="text-center p-5 bg-white rounded shadow-sm mt-4">
        <div class="mb-3 text-muted">
            <i class="fa-solid fa-basket-shopping fa-3x"></i>
        </div>
        <h4 class="text-muted mb-3">Your cart is empty!</h4>
        <p>Looks like you haven't added any food yet.</p>
        <a href="/canteens" class="btn btn-success rounded-pill px-4 mt-2">Browse Canteens</a>
    </div>

    <!-- 3. What to show if the cart HAS ITEMS -->
    <div th:if="${session.cart != null and !session.cart.isEmpty()}" class="bg-white rounded shadow-sm p-4 mt-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Item</th>
                    <th class="text-center">Quantity</th>
                    <th class="text-end">Price</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${session.cart != null}" th:each="item : ${session.cart}">

                    <td class="fw-bold text-dark" th:text="${item.itemName}">Dish Name</td>

                    <td class="text-center">
                        <div class="d-flex align-items-center justify-content-center gap-2">
                            <form th:action="@{/cart/update}" method="post" class="m-0">
                                <input type="hidden" name="itemId" th:value="${item.itemId}">
                                <input type="hidden" name="action" value="decrease">
                                <button type="submit" class="btn btn-sm btn-outline-secondary rounded-circle" style="width: 28px; height: 28px; padding: 0; line-height: 1;">-</button>
                            </form>

                            <span class="fw-bold fs-5 px-2" th:text="${item.quantity}">1</span>

                            <form th:action="@{/cart/update}" method="post" class="m-0">
                                <input type="hidden" name="itemId" th:value="${item.itemId}">
                                <input type="hidden" name="action" value="increase">
                                <button type="submit" class="btn btn-sm btn-outline-secondary rounded-circle" style="width: 28px; height: 28px; padding: 0; line-height: 1;">+</button>
                            </form>
                        </div>
                    </td>

                    <td class="text-success fw-bold text-end" th:text="'₹ ' + (${item.price} * ${item.quantity})">₹ 0.00</td>

                    <td class="text-center">
                        <form th:action="@{/cart/update}" method="post" class="m-0">
                            <input type="hidden" name="itemId" th:value="${item.itemId}">
                            <input type="hidden" name="action" value="remove">
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle" title="Remove item" style="width: 32px; height: 32px; padding: 0;">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

        <hr class="my-4">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
            <h3 class="fw-bold m-0 mb-3 mb-md-0">Total: <span class="text-success" th:text="'₹ ' + ${total}">₹ 0.00</span></h3>

            <form th:action="@{/cart/payment}" method="get" class="m-0">
                <button type="submit" class="btn btn-success btn-lg rounded-pill px-5 shadow-sm">Proceed to Pay</button>
            </form>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
