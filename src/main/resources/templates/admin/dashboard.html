<!DOCTYPE html>
<html lang ="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">


<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Incoming Orders</h2>
    <div class="d-flex gap-2">
        <a th:href="@{/admin/manage-menu}" class="btn btn-info text-white fw-bold">Manage Menu & Canteens ⚙️</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-danger fw-bold">Logout</button>
        </form>
    </div>
</div>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Order ID</th>
        <th>User</th>
        <th>Items</th>
        <th>Total</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td class="fw-bold" th:text="'#' + ${order.id}"></td>

        <!-- ENHANCED: Orderer Info Column -->
        <td>
            <span class="fw-bold text-primary" th:text="${order.user.name}"></span><br>
            <small class="text-muted" th:text="'ID: ' + ${order.user.collegeId}"></small><br>
            <span class="badge bg-info mt-1"
                  th:if="${order.user.dietaryPreference != null and order.user.dietaryPreference != 'None'}"
                  th:text="${order.user.dietaryPreference}">
            </span>
        </td>

        <td>
            <ul class="list-unstyled mb-0">
                <li th:each="item : ${order.orderItems}"
                    th:text="${item.itemName} + ' x' + ${item.quantity}"></li>
            </ul>
        </td>
        <td class="fw-bold text-success" th:text="'₹' + ${order.totalAmount}"></td>
        <td>
            <span class="badge bg-warning" th:text="${order.status}"></span>
        </td>
        <td>
            <div th:if="${error}" class="alert alert-danger p-1 text-center" style="font-size: 0.8rem;" th:text="${error}"></div>
            <div class="d-flex flex-column gap-2">

                <!-- Status Update Buttons -->
                <form th:action="@{/admin/order/{id}/status(id=${order.id})}" method="post" class="d-flex gap-2">
                    <button name="status" value="PREPARING" class="btn btn-sm btn-primary flex-grow-1">Prepare</button>
                    <button name="status" value="READY" class="btn btn-sm btn-success flex-grow-1">Ready</button>
                    <!-- NEW: Cancel Order Button -->
                    <button name="status" value="CANCELLED" class="btn btn-sm btn-danger flex-grow-1"
                            onclick="return confirm('Are you sure you want to cancel this order? The student will not receive their food.');">
                        Cancel
                    </button>
                </form>

                <!-- OTP Delivery Input -->
                <form th:action="@{/admin/order/{id}/deliver(id=${order.id})}" method="post" class="input-group input-group-sm mt-1">
                    <input type="text" name="otp" class="form-control" placeholder="OTP" required maxlength="6">
                    <button type="submit" class="btn btn-dark">Deliver</button>
                </form>
            </div>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
