<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEats - Add Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
            <h3 class="mb-0 fw-bold">Reference New Canteen</h3>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-danger fw-bold shadow-sm">Logout</button>
            </form>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/admin/add-canteen}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold" for="name">Canteen Name</label>
                    <input type="text" name="name" class="form-control" id="name" placeholder="e.g. New Block Canteen" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="location">Location</label>
                    <input type="text" name="location" class="form-control" id="location" placeholder="e.g. Near Library Gate" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="description">Short Description</label>
                    <input type="text" name="description" class="form-control" id="description" placeholder="e.g. Great coffee and fresh pastries." required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" for="imageUrl">Image Path</label>
                    <input type="text" name="imageUrl" class="form-control" id="imageUrl" value="/images/Happiness.jpg" required>
                    <div class="form-text text-muted">
                        Enter the path to an existing image in your static/images folder (e.g., /images/gate 1.jpg).
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/admin/manage-menu" class="btn btn-outline-secondary me-md-2">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-bold">Add Canteen</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
