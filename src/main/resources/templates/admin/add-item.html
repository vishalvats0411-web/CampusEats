<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Menu Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 600px;">

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Add New Menu Item</h3>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light fw-bold">Logout</button>
            </form>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/admin/add-item}" method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label fw-bold" for="name">Item Name</label>
                    <input type="text" name="name" class="form-control" id="name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="price">Price (₹)</label>
                    <input type="number" step="0.5" name="price" class="form-control" id="price" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="description">Description</label>
                    <input type="text" name="description" class="form-control" id="description" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="category">Category</label>
                    <select name="category" class="form-select" id="category" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Fast Food">Fast Food</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="canteenNames">Select Canteen(s)</label>
                    <select name="canteenNames" class="form-select" id="canteenNames" multiple required style="height: 100px;">
                        <option th:each="canteen : ${canteens}"
                                th:value="${canteen.name}"
                                th:text="${canteen.name}"></option>
                    </select>
                    <div class="form-text text-muted">Hold Ctrl (Windows) or Cmd (Mac) to select multiple canteens.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" for="imageFile">Upload Image</label>
                    <input type="file" name="imageFile" class="form-control" id="imageFile" accept="image/*">
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/admin/manage-menu" class="btn btn-outline-secondary me-md-2">Cancel</a>
                    <button type="submit" class="btn btn-success">Add Item</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
